name: Release

# Publishing a GitHub Release is what starts this: write the notes, publish, and
# the binaries, the Homebrew tap, and the crates.io release follow. The release
# therefore exists before its assets do — expect a few minutes with the notes up
# and nothing attached.
#
# The tag is the single source of the version. Nothing in the tree records it:
# `version` in Cargo.toml is a placeholder the crates.io job rewrites from the
# tag, so cutting a release never means remembering to bump a file first.
on:
  release:
    types: [published]

permissions:
  contents: write

# The tag reaches every step through the environment rather than being
# interpolated into a script, so its text can never be read as shell.
env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # Shared with CI, which runs the same matrix on every pull request — see
  # build.yml for why the definition is not duplicated here.
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  # The flake as `nix run github:armaniacs/agentlens/vX.Y.Z` fetches it: from the
  # archive GitHub serves for the tag, whose VERSION holds the tag. That build
  # differs from main's even for the same commit, so it is built here, and the
  # run fails unless it reports the release.
  #
  # The pin keeps it: an ordinary build is collectable under the cache's
  # retention policy, which would leave the tag compiling from source. The pin
  # name is per system but deliberately NOT per tag: every release re-pins the
  # same name and so becomes a new revision of it, which is what makes
  # --keep-revisions meaningful — a tag in the name would give each pin exactly
  # one revision and retain them all, which is the storage growth this cache
  # cannot afford.
  nix:
    uses: lambdalisue/nix-github-release/.github/workflows/build.yml@v0.1.0
    with:
      ref: ${{ github.event.release.tag_name }}
      cachix-cache: agentlens
      cachix-pin: release
    secrets:
      cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # One job owns the upload so the matrix builds cannot race, and so the checksums
  # are computed from exactly the bytes that get attached.
  release:
    name: attach assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          for f in agentlens-*.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256

      # `gh release upload` only adds assets. An action that creates-or-updates
      # the release could rewrite the notes that were just published by hand,
      # which is the one thing this job must not touch. --clobber keeps a re-run
      # idempotent instead of failing on an asset that is already there.
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the source out — it only needs the artifacts —
          # so gh has no git remote to infer the repository from and must be
          # told explicitly.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  # Pin the tap to the archives this release just published. Runs after the
  # assets are attached so the URLs in the formula resolve the moment it lands.
  homebrew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # HOMEBREW_TAP_TOKEN is a PAT with contents:write on the tap repository —
      # GITHUB_TOKEN is scoped to this repository and cannot push across repos.
      #
      # persist-credentials must stay false: the default writes the PAT into
      # tap/.git/config, and the verification step below runs the freshly built
      # release binary. A compromised binary (ours or a dependency's) could then
      # read a credential that lets it rewrite the tap. The push step supplies
      # the token on its own instead.
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: armaniacs/homebrew-agentlens
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: tap

      - name: Render formula
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/armaniacs/agentlens/releases/download/${TAG}"
          # $1 = target triple -> the sha256 of that target's archive.
          sha() {
            sha256sum "dist/agentlens-${TAG}-$1.tar.gz" | cut -d' ' -f1
          }
          mkdir -p tap/Formula
          cat > tap/Formula/agentlens.rb <<EOF
          # Generated by the agentlens release workflow. Do not edit by hand.
          class Cclens < Formula
            desc "A lens onto your Claude Code usage"
            homepage "https://github.com/armaniacs/agentlens"
            version "${version}"

            on_macos do
              on_arm do
                url "${base}/agentlens-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/agentlens-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/agentlens-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/agentlens-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "agentlens"
            end

            test do
              assert_match "agentlens", shell_output("#{bin}/agentlens --help")
            end
          end
          EOF
          cat tap/Formula/agentlens.rb

      # Install the rendered formula before publishing it. A URL typo, a sha256
      # paired with the wrong triple, or a binary that will not start all reach
      # the tap otherwise, and users are the ones who discover it. Only the
      # Linux x86_64 archive is downloaded and installed here; the other triples
      # the formula names are rendered by the same loop but never fetched.
      - name: Verify formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          set -euo pipefail
          # Homebrew ships preinstalled on the GitHub-hosted Ubuntu image but is
          # not on PATH there, so the known prefix stays as a fallback. Prefer
          # PATH so a self-hosted runner that exposes brew normally just works.
          if ! command -v brew >/dev/null; then
            if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            else
              echo "brew not found on PATH or at /home/linuxbrew/.linuxbrew" >&2
              exit 1
            fi
          fi
          # Homebrew refuses a loose formula file, so expose the checkout as a
          # real tap instead of copying the formula somewhere it would go stale.
          tap="$(brew --repository)/Library/Taps/armaniacs/homebrew-agentlens"
          mkdir -p "$(dirname "$tap")"
          ln -s "$PWD/tap" "$tap"
          brew install armaniacs/agentlens/agentlens
          brew test armaniacs/agentlens/agentlens

      - name: Commit and push
        working-directory: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agentlens.rb
          if git diff --staged --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git commit -m "agentlens ${TAG}"
          # The helper reads TAP_TOKEN from the environment when git invokes it,
          # so the PAT reaches neither argv (a remote URL would expose it to
          # every process on the runner) nor .git/config. The empty first value
          # drops any helper the runner image configured.
          #
          # The single quotes are load-bearing: git must expand $TAP_TOKEN when
          # it runs the helper, not this shell when it builds the argument.
          # shellcheck disable=SC2016
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$TAP_TOKEN"; }; f' \
              push origin HEAD:main

  # The third distribution channel, next to the release assets and the tap.
  # Gated on the cross-platform build because this is the one step in the file a
  # re-run cannot undo: a crates.io version is permanent — it can be yanked, but
  # never replaced or deleted — so a target that stopped compiling should stop
  # the publish rather than be discovered afterwards.
  crates-io:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: the OIDC token minted for this job is exchanged for
      # a crates.io token that lives minutes, so no long-lived registry
      # credential is stored in this repository at all. `contents: read` narrows
      # the file-level `contents: write`, which only the asset upload needs.
      #
      # crates.io must know this job first: the crate's Settings > Trusted
      # Publishing names this repository, `release.yml`, and this job's
      # environment (none). That registration can only be made on a crate that
      # already exists, so the very first version is published by hand.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Set version from tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # cargo would reject a non-semver version much later, after the
          # verification build; fail on the tag itself instead. Close enough to
          # semver that anything reaching cargo is accepted there: no leading
          # zeros, a prerelease before build metadata, one of each at most.
          printf '%s' "$version" |
            grep -Eq '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || {
            echo "tag ${TAG} does not name a semver version" >&2
            exit 1
          }
          # The version reaches perl through the environment, not through the
          # program text, so a tag can never be read as code. Only the first
          # line-anchored `version =` is rewritten — that is the package's, since
          # dependency versions all sit inside inline tables.
          VERSION="$version" \
            perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          # `--workspace` re-resolves workspace members only — a dependency is
          # touched solely if it has gone missing from the lock — so what gets
          # published carries the tagged commit's dependency set, and --locked
          # below still means the committed lock.
          cargo update --workspace
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Re-running the workflow on a release whose version is already up must be
      # a no-op, like the --clobber upload and the tap's "already up to date"
      # above — an existing version is the expected state of a re-run, not an
      # error.
      - name: Check whether the version is already published
        id: check
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: agentlens release workflow (https://github.com/armaniacs/agentlens)' \
            "https://crates.io/api/v1/crates/agentlens/${VERSION}")
          case "$code" in
            200) echo "agentlens ${VERSION} is already on crates.io"
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "unexpected status ${code} from crates.io" >&2; exit 1 ;;
          esac

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.check.outputs.published == 'false'

      # --allow-dirty: the rewrite above leaves Cargo.toml and Cargo.lock
      # modified against the tagged commit, which is the whole design — the
      # version is never committed. The packaged files are the working tree's,
      # so the crate carries the tag's version.
      - name: Publish
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --allow-dirty
